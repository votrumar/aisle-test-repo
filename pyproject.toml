[project]
name = "aisle-test-repo"
version = "0.1.0"
description = "Sample project with a known-vulnerable dependency for SCA testing."
requires-python = ">=3.10"
dependencies = [
    "Pillow==8.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
