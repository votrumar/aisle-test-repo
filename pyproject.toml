[project]
name = "storage-monitoring"
version = "0.1.0"
description = "FastAPI service for sensor measurements, threshold alerts, and a built-in dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette==1.0.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2==3.1.2",
    "python-multipart>=0.0.9",
    "paramiko==2.9.2",
    "lxml==4.9.0",
    "aiohttp==3.9.1",
    "Werkzeug==3.0.0",
    "python-jose==3.3.0",
    "PyYAML==5.4",
    "defusedyaml>=0.7.1",
    "cryptography==38.0.4",
    "gunicorn==21.2.0",
    "requests==2.31.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]
dev = ["wheel==0.37.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
