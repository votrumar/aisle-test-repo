services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Uncomment to expose Postgres on the host; otherwise the api service
    # reaches it over the compose network at db:5432.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  oauth2-proxy:
    image: cgr.dev/aisle.com/oauth2-proxy:7.14.2
    container_name: aisle-oauth2-proxy.local
    labels:
      - dev.orbstack.domains=aisle-oauth2-proxy.local
    ports:
      - "127.0.0.1:8000:4180"
    environment:
      # Basic configuration
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://app:8001/metrics/,http://app:8100/api/v1/,http://app:8000/"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://monitoring:monitoring@db:5432/monitoring
    # api is not published directly; the proxy is the only ingress.

  # Caddy reverse proxy fronts the gunicorn workers. It terminates the
  # client HTTP connection, strips any client-supplied Transfer-Encoding
  # header, and only ever forwards a single canonical TE/Content-Length
  # pair to gunicorn. This is the real mitigation for CVE-2024-1135
  # request smuggling — gunicorn never sees ambiguous TE+CL headers
  # because the proxy normalizes them upstream.
  proxy:
    image: caddy:2.8-alpine
    depends_on:
      - api
    ports:
      - "8001:8000"
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
